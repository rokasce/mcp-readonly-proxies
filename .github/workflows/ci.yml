name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s
          --health-retries 20
    env:
      # Runs the storage and two-replica sign-in tests against a real Redis.
      MCP_GUARD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs the tests in its test stage)
        run: docker build -t mcp-guard:ci .
      - name: Smoke test
        run: |
          docker run -d --name guard -p 3000:3000 \
            -e MCP_GUARD_UPSTREAM=gmail \
            -e MCP_GUARD_BASE_URL=http://localhost:3000 \
            -e MCP_GUARD_GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com \
            -e MCP_GUARD_GOOGLE_CLIENT_SECRET=ci-secret \
            -e MCP_GUARD_ALLOWED_DOMAIN=example.com \
            mcp-guard:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/health && break; sleep 1; done
          curl -fs localhost:3000/health | grep '"upstream":"gmail"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/mcp)" = 401
          docker logs guard
