[project]
name = "mcp-guard"
version = "0.1.0"
description = "Allowlist proxy in front of Gmail (and other Google-signed-in MCP upstreams): agents see and call only approved read-only tools"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "erce", email = "rokasce@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6,<5",
    "httpx2>=2.16",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "cryptography>=46",
    "py-key-value-aio[redis]>=0.4.6",
    "uvicorn>=0.54",
]

[project.scripts]
mcp-guard = "mcp_guard.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "pyright>=1.1.407",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "C4", "PL"]
ignore = [
    "PLR0913", # explicit constructor arguments are clearer than option bags here
    "PLR2004", # magic values are fine in tests and HTTP status checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "PLR0911", "PLR0915", "PLC0415"]
"docs/site/build.py" = ["E501"] # embedded HTML, CSS and JS templates

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # py-key-value's Redis store still calls redis' setex; not ours to change.
    "ignore:Call to deprecated setex:DeprecationWarning",
    # The tests' OAuth client keeps its tokens in memory on purpose.
    "ignore:Using in-memory token storage:UserWarning",
]
