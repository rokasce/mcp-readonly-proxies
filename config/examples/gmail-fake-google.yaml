# Local trial without a real Google OAuth client: the Gmail proxy wired to the fake Google
# in tests/fakes/fake_google.py (OAuth, JWKS, tokeninfo and a small fake mailbox).
# See docs/local-development.md. Never deploy this file.

upstream:
  kind: native
  name: gmail
  provider: gmail
  gmail:
    api_base_url: http://127.0.0.1:9000

server:
  public_base_url: http://localhost:8000

identity:
  provider: google
  client_id: test-client.apps.googleusercontent.com
  client_secret: test-client-secret
  workspace_domain: example.com
  endpoints:
    authorization_endpoint: http://127.0.0.1:9000/o/oauth2/v2/auth
    token_endpoint: http://127.0.0.1:9000/token
    revocation_endpoint: http://127.0.0.1:9000/revoke
    tokeninfo_endpoint: http://127.0.0.1:9000/tokeninfo
    jwks_uri: http://127.0.0.1:9000/oauth2/v3/certs

client_auth:
  mode: personal_key

storage:
  database_url: ${DATABASE_URL:-sqlite:///./data/gmail-fake.db}
  encryption_keys: ${TOKEN_ENCRYPTION_KEYS}
  session_secret: ${SESSION_SECRET}

allow:
  - name: search_threads
    sha256: 29033c34f9abd6b41d5bb24d33f0a8fa0e86ed75a876ac5fdbed8a145ecb7f0d
    title: Search Gmail threads
  - name: get_thread
    sha256: 787d5e66ad8d0e8cbff3b267f3d8f6add17fa452e5b9e09f7de0af084ea8a4e6
    title: Read a Gmail thread
  - name: get_message
    sha256: 2843e06b0a6e77394cf2a221e87e26c873a1691b4890a35da4fec60c2dd43a2f
    title: Read a Gmail message
  - name: list_labels
    sha256: 39763613cf69b9338f948ada0ab8a31bd54716379cb3bb73c8836480d1deb844
    title: List Gmail labels
  - name: list_drafts
    sha256: ec48f7fbf464259fa1203dc09a485ebd1583f8e6b75a346bb598d4b21e7eea28
    title: List Gmail drafts
